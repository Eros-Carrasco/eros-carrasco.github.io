<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SplatLab | Eros Carrasco</title>
  <meta name="description"
    content="Gaussian splat research at NYU Tandon: a scanned room that finds its own objects, lets you move or remove them and fills in what the scanner never saw, live and fully local. Shown at Adobe MAX 2026." />
  <link rel="canonical" href="https://eros-carrasco.github.io/projects/splatlab/" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Eros Carrasco" />
  <meta property="og:url" content="https://eros-carrasco.github.io/projects/splatlab/" />
  <meta property="og:title" content="SplatLab" />
  <meta property="og:description"
    content="A scanned room that knows what is in it, comes apart into objects you can move, and fills in what the scanner never saw." />
  <meta property="og:image" content="https://eros-carrasco.github.io/assets/images/poster_splatlab.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="../../css/styles.css" />
  <link rel="icon" type="image/png" href="/assets/images/favicon_0.png" />

  <style>
    /* The worlds to look at, each in its own viewer (worlds.js). */
    .worlds-lead { margin: 0 0 14px; line-height: 1.6; opacity: 0.85; }
    .worlds-pick { margin: 0; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; font: inherit; font-size: 13px; line-height: 1.3; opacity: 0.9; cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease; }
    .worlds-pick:hover { border-color: rgba(255, 255, 255, 0.3); }
    .worlds-pick[aria-pressed="true"] { background: rgba(93, 220, 255, 0.14); border-color: rgba(93, 220, 255, 0.55); opacity: 1; }
    .worlds-pick:focus-visible { outline: 2px solid #5ddcff; outline-offset: 2px; }
    .worlds-stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #08080a; border: 1px solid rgba(255, 255, 255, 0.08); }
    /* A finger held on a world is a hold, never a text selection or the phone's callout (Eros, 2026-11-19:
       on a phone, moving a thing or the view selected the page around it). */
    .worlds-stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .worlds-stage canvas { position: relative; z-index: 1; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .worlds-sky { position: absolute; left: 0; top: 0; width: 100%; height: 400%; z-index: 0; pointer-events: none; will-change: transform;
      background: linear-gradient(to bottom, #04051a 0%, #0c0f3a 30%, #2a1763 41%, #6a2277 46%, #c23a72 48.6%, #ff8a4c 49.7%, #ffd89a 50%, #0b1024 50.05%, #070b18 56%, #04060e 100%); }
    .worlds-town { position: absolute; left: 0; width: 100%; background-repeat: repeat-x; }
    /* One pill, as on the ASUS page: higher off the floor and nudging sideways until the view is first moved. */
    .worlds-hint { position: absolute; left: 50%; bottom: 44px; z-index: 2; margin: 0; padding: 6px 12px; border-radius: 999px; background: rgba(10, 17, 23, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.85); white-space: nowrap; transform: translateX(-50%); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    .worlds-hint span + span::before { content: "\00a0\00b7\00a0"; }
    .worlds-stage.is-ready .worlds-hint { opacity: 1; animation: worlds-nudge 2.4s ease-in-out 1s infinite; }
    .worlds-stage .worlds-hint.is-gone { opacity: 0; animation: none; }
    @keyframes worlds-nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% + 6px)); } }
    @keyframes worlds-bob { 0%, 100% { transform: translateX(-50%); } 50% { transform: translate(-50%, -4px); } }
    .worlds-hint .by-touch { display: none; }
    @media (pointer: coarse) {
      .worlds-hint .by-touch { display: inline; }
      .worlds-hint .by-mouse { display: none; }
    }
    .worlds-wait { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; pointer-events: none; color: #fff; text-align: center; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6); }
    .worlds-wait[hidden], .worlds-wait [hidden] { display: none; }
    .worlds-wait-num { font-size: clamp(44px, 8vw, 80px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .worlds-wait-bar { width: min(280px, 60%); height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
    .worlds-wait-bar i { display: block; width: 0; height: 100%; border-radius: 999px; background: #5ddcff; }
    .worlds-wait-what { font-size: 15px; color: rgba(255, 255, 255, 0.78); }
    /* The breakroom's things: what can be moved, the controls under it, the light's handle. */
    .worlds-hint .in-room { display: none; }
    .worlds-stage.is-room .worlds-hint .in-room { display: inline; }
    .worlds-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
    .worlds-tools[hidden], .worlds-tools [hidden] { display: none; }
    .worlds-lamp { --glow: 255, 190, 110; --core: #ffcf7a; position: absolute; z-index: 3; width: 34px; height: 34px; margin: -17px 0 0 -17px; padding: 0; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85); background: radial-gradient(circle, #fffaf0 0%, var(--core) 35%, rgba(var(--glow), 0.15) 70%, rgba(var(--glow), 0) 100%);
      box-shadow: 0 0 18px rgba(var(--glow), 0.8); cursor: grab; touch-action: none; }
    .worlds-lamp[data-tone="white"] { --glow: 235, 238, 245; --core: #f4f4f0; }
    .worlds-lamp[data-tone="cool"] { --glow: 120, 180, 255; --core: #9cc8ff; }
    .worlds-lamp-tip { position: absolute; z-index: 2; margin: 24px 0 0; padding: 4px 10px; border-radius: 999px; transform: translateX(-50%); white-space: nowrap;
      background: rgba(10, 17, 23, 0.75); border: 1px solid rgba(255, 255, 255, 0.14); font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.9); pointer-events: none; }
    .worlds-lamp-tip[hidden] { display: none; }
    .worlds-tone { display: inline-flex; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden; }
    .worlds-tone[hidden] { display: none; }
    .worlds-tone .worlds-pick { border: 0; border-radius: 0; display: inline-flex; align-items: center; gap: 6px; }
    .worlds-tone .worlds-pick + .worlds-pick { border-left: 1px solid rgba(255, 255, 255, 0.12); }
    .worlds-tone i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 6px var(--dot); }
    .mocap-grid.clips-2x2 { grid-template-columns: repeat(2, 1fr); }
    .worlds-lamp[hidden] { display: none; }
    .worlds-lamp:focus-visible { outline: 2px solid #5ddcff; outline-offset: 2px; }
    /* The page's three parts, each opened by a number and a title over a line. */
    .splat-part { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 46px 4px 2px; }
    .splat-part b { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #5ddcff; }
    .splat-part h2 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; line-height: 1.2; color: #fff; }
    .splat-part::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.16); }
    .part-media-full { margin-top: 14px; }
    .part-media-full .fig { margin: 0; }
    /* Two pictures in a row stand at the same height: each takes width in proportion to its shape (set below once it loads),
       so the captions start on one line. */
    @media (min-width: 761px) {
      .part-block-row .part-media { display: flex; flex-direction: row; gap: 24px; align-items: flex-start; }
      .part-block-row .fig { flex: 1 1 0; min-width: 0; }
      .part-block-row .fig a { display: block; }
      .part-block-row .fig img, .part-block-row .fig video { width: 100%; height: auto; max-height: none; }
    }
    .part-media-full .fig img { width: 100%; max-height: none; }
    /* Three things from the booth under its scan, one of each kind, all the same height: a visitor using it,
       me showing it, the badge. */
    .booth-docs { display: grid; grid-template-columns: 0.75fr 1.333fr 0.75fr; gap: 14px; margin: 18px 0 0; align-items: start; }
    .booth-docs figure { margin: 0; }
    .booth-docs video, .booth-docs img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); background: #08080a; }
    .booth-docs .booth-wide img { aspect-ratio: 4 / 3; object-position: 75% 50%; }
    @media (max-width: 640px) {
      .booth-docs { grid-template-columns: 1fr 1fr; }
      .splat-part { margin-top: 34px; gap: 10px; }
      .splat-part h2 { font-size: 19px; }
      .booth-docs .booth-wide { grid-column: 1 / -1; order: -1; }
      .worlds-stage { aspect-ratio: 4 / 3; }
      .worlds-pick { font-size: 12px; padding: 5px 10px; }
      .worlds-hint { bottom: 16px; width: max-content; max-width: calc(100% - 28px); white-space: normal; text-align: center; font-size: 12px; }
      .worlds-hint span { white-space: nowrap; }
      .worlds-stage.is-ready .worlds-hint { animation-name: worlds-bob; }     /* sideways, it left the stage at this width */
    }
  </style>
</head>

<body class="project-page">
  <div class="project-page-back">
    <a href="../../" class="back-btn">← Back</a>
  </div>

  <main class="page-inner" id="project-root"></main>

  <script src="../../js/parallax.js"></script>
  <script>const BASE_URL = "../../";</script>
  <script src="../../js/projects.js"></script>
  <script>
    document.getElementById("project-root").innerHTML = renderProject("splatlab");
  </script>

  <!-- The worlds to look at, each in its own viewer (worlds.js): the breakroom goes in after the
       page's first section, the ASUS booth in its own place further down (the booth slot). -->
  <template id="worlds-room">
    <section class="project-section span-2">
      <h2 class="section-title">Try It: The Breakroom</h2>
      <p class="worlds-lead">A breakroom taken apart by my engine. Drag a table, an island, a bin or a stool across the floor, clear the whole room and see what was behind, or turn on a light and carry it through the room.</p>
      <div class="worlds-stage" data-world="breakroom" data-name="Breakroom">
        <canvas id="worlds-room-canvas"></canvas>
        <p class="worlds-hint">
          <span class="in-room">Drag furniture to move it</span>
          <span>Drag to turn</span>
          <span class="by-mouse">Scroll to zoom</span>
          <span class="by-touch">Pinch to zoom</span>
        </p>
      </div>
    </section>
  </template>
  <template id="worlds-booth">
    <h2 class="section-title">The ASUS ProArt Booth</h2>
    <p class="worlds-lead">I went with ASUS to their ProArt booth at Adobe MAX 2026 in Miami to show this research live, and scanned the booth during the show with an XGRIDS PortalCam.</p>
    <div class="worlds-stage" data-world="booth" data-name="ASUS booth, Adobe MAX 2026">
      <canvas id="worlds-booth-canvas"></canvas>
      <p class="worlds-hint">
        <span>Drag to turn</span>
        <span class="by-mouse">Scroll to zoom</span>
        <span class="by-touch">Pinch to zoom</span>
      </p>
    </div>
    <div class="booth-docs">
      <figure>
        <video src="../../assets/videos/splatlab_max_visitor.mp4" poster="../../assets/images/poster_splatlab_max_visitor.jpg" aria-label="A visitor at the booth moving the breakroom's tables on screen" muted loop playsinline preload="none" data-play-when-seen></video>
      </figure>
      <figure class="booth-wide">
        <img src="../../assets/images/splatlab_max_booth.jpg" alt="Eros explaining the engine to a visitor at the booth, the breakroom on the screen behind them" loading="lazy" />
      </figure>
      <figure>
        <img src="../../assets/images/splatlab_max_badge.jpg" alt="Eros's Adobe MAX badge, NYU, sponsor, in front of the Adobe MAX registration hall" loading="lazy" />
      </figure>
    </div>
  </template>
  <script>
    (() => {
      const tryIt = document.getElementById("splatlab-try");
      if (tryIt) tryIt.replaceWith(document.getElementById("worlds-room").content);
      const slot = document.getElementById("splatlab-booth");
      if (slot) slot.appendChild(document.getElementById("worlds-booth").content);
      // Each picture in a two-up row gets width in proportion to its shape, so both stand at the same height.
      document.querySelectorAll(".part-block-row .part-media > .fig").forEach((fig) => {
        const m = fig.querySelector("img, video"); if (!m) return;
        const set = () => { const w = m.naturalWidth || m.videoWidth, h = m.naturalHeight || m.videoHeight; if (w && h) fig.style.flexGrow = (w / h).toFixed(3); };
        set(); m.addEventListener(m.tagName === "IMG" ? "load" : "loadedmetadata", set);
      });
      // The booth clip is far down the page: it downloads and plays only once it comes into view.
      document.querySelectorAll("video[data-play-when-seen]").forEach((v) => {
        new IntersectionObserver(([e]) => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }, { rootMargin: "200px" }).observe(v);
      });
    })();
  </script>
  <script src="../../js/vendor/playcanvas.min.js"></script>
  <script src="worlds.js?v=20261119a"></script>
</body>

</html>
