<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SplatLab | Eros Carrasco</title>
  <meta name="description"
    content="Gaussian splat research at NYU Tandon: a scanned room that finds its own objects, lets you move or remove them and fills in what the scanner never saw, live and fully local. Shown at Adobe MAX 2026." />
  <link rel="canonical" href="https://eros-carrasco.github.io/projects/splatlab/" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Eros Carrasco" />
  <meta property="og:url" content="https://eros-carrasco.github.io/projects/splatlab/" />
  <meta property="og:title" content="SplatLab" />
  <meta property="og:description"
    content="A scanned room that knows what is in it, comes apart into objects you can move, and fills in what the scanner never saw." />
  <meta property="og:image" content="https://eros-carrasco.github.io/assets/images/poster_splatlab.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="../../css/styles.css" />
  <link rel="icon" type="image/png" href="/assets/images/favicon_0.png" />

  <style>
    /* The worlds to look at, each in its own viewer (worlds.js). */
    .worlds-lead { margin: 0 0 14px; line-height: 1.6; opacity: 0.85; }
    .worlds-pick { margin: 0; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; font: inherit; font-size: 13px; line-height: 1.3; opacity: 0.9; cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease; }
    .worlds-pick:hover { border-color: rgba(255, 255, 255, 0.3); }
    .worlds-pick[aria-pressed="true"] { background: rgba(93, 220, 255, 0.14); border-color: rgba(93, 220, 255, 0.55); opacity: 1; }
    .worlds-pick:focus-visible { outline: 2px solid #5ddcff; outline-offset: 2px; }
    .worlds-stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #08080a; border: 1px solid rgba(255, 255, 255, 0.08); }
    .worlds-stage canvas { position: relative; z-index: 1; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .worlds-sky { position: absolute; left: 0; top: 0; width: 100%; height: 400%; z-index: 0; pointer-events: none; will-change: transform;
      background: linear-gradient(to bottom, #04051a 0%, #0c0f3a 30%, #2a1763 41%, #6a2277 46%, #c23a72 48.6%, #ff8a4c 49.7%, #ffd89a 50%, #0b1024 50.05%, #070b18 56%, #04060e 100%); }
    .worlds-town { position: absolute; left: 0; width: 100%; background-repeat: repeat-x; }
    .worlds-hint { position: absolute; left: 50%; bottom: 14px; z-index: 2; display: flex; gap: 6px; margin: 0; white-space: nowrap; transform: translateX(-50%); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    .worlds-hint span { padding: 5px 11px; border-radius: 999px; background: rgba(10, 17, 23, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.85); }
    .worlds-stage.is-ready .worlds-hint { opacity: 1; }
    .worlds-stage .worlds-hint.is-gone { opacity: 0; }
    .worlds-hint .by-touch { display: none; }
    @media (pointer: coarse) {
      .worlds-hint .by-touch { display: inline; }
      .worlds-hint .by-mouse { display: none; }
    }
    .worlds-wait { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; pointer-events: none; color: #fff; text-align: center; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6); }
    .worlds-wait[hidden], .worlds-wait [hidden] { display: none; }
    .worlds-wait-num { font-size: clamp(44px, 8vw, 80px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .worlds-wait-bar { width: min(280px, 60%); height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
    .worlds-wait-bar i { display: block; width: 0; height: 100%; border-radius: 999px; background: #5ddcff; }
    .worlds-wait-what { font-size: 15px; color: rgba(255, 255, 255, 0.78); }
    /* The breakroom's things: what can be moved, the controls under it, the lamp's handle. */
    .worlds-hint .in-room { display: none; }
    .worlds-stage.is-room .worlds-hint .in-room { display: inline; }
    .worlds-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
    .worlds-tools[hidden], .worlds-tools [hidden] { display: none; }
    .worlds-lamp { position: absolute; z-index: 2; width: 34px; height: 34px; margin: -17px 0 0 -17px; padding: 0; border-radius: 50%;
      border: 2px solid rgba(255, 236, 200, 0.9); background: radial-gradient(circle, #fff6e0 0%, #ffcf7a 35%, rgba(255, 160, 60, 0.15) 70%, rgba(255, 160, 60, 0) 100%);
      box-shadow: 0 0 18px rgba(255, 190, 110, 0.8); cursor: grab; touch-action: none; }
    .worlds-lamp[hidden] { display: none; }
    .worlds-lamp:focus-visible { outline: 2px solid #5ddcff; outline-offset: 2px; }
    @media (max-width: 640px) {
      .worlds-stage { aspect-ratio: 4 / 3; }
      .worlds-pick { font-size: 12px; padding: 5px 10px; }
    }
  </style>
</head>

<body class="project-page">
  <div class="project-page-back">
    <a href="../../" class="back-btn">← Back</a>
  </div>

  <main class="page-inner" id="project-root"></main>

  <script src="../../js/parallax.js"></script>
  <script>const BASE_URL = "../../";</script>
  <script src="../../js/projects.js"></script>
  <script>
    document.getElementById("project-root").innerHTML = renderProject("splatlab");
  </script>

  <!-- The worlds to look at, each in its own viewer (worlds.js): the breakroom goes in after the
       page's first section, the ASUS booth in its own place further down (the booth slot). -->
  <template id="worlds-room">
    <section class="project-section span-2">
      <h2 class="section-title">Try It: The Breakroom</h2>
      <p class="worlds-lead">A breakroom taken apart by my engine. Drag a table, an island, a bin or a stool across the floor, clear the whole room and see what was behind, or carry a lamp through it.</p>
      <div class="worlds-stage" data-world="breakroom" data-name="Breakroom">
        <canvas id="worlds-room-canvas"></canvas>
        <p class="worlds-hint">
          <span class="in-room">Drag a table to move it</span>
          <span>Drag to turn</span>
          <span class="by-mouse">Scroll to zoom</span>
          <span class="by-touch">Pinch to zoom</span>
        </p>
      </div>
    </section>
  </template>
  <template id="worlds-booth">
    <h2 class="section-title">The ASUS Booth at Adobe MAX 2026</h2>
    <p class="worlds-lead">I went with ASUS to their ProArt booth at Adobe MAX 2026 in Miami to show this research live, and scanned the booth during the show with an XGRIDS PortalCam. The booth below was processed with XGRIDS LCC, not trained by my own pipeline.</p>
    <div class="worlds-stage" data-world="booth" data-name="ASUS booth, Adobe MAX 2026">
      <canvas id="worlds-booth-canvas"></canvas>
      <p class="worlds-hint">
        <span>Drag to turn</span>
        <span class="by-mouse">Scroll to zoom</span>
        <span class="by-touch">Pinch to zoom</span>
      </p>
    </div>
  </template>
  <script>
    (() => {
      const first = document.querySelector("#project-root .project-sections > .project-section");
      if (first) first.after(document.getElementById("worlds-room").content);
      const slot = document.getElementById("splatlab-booth");
      if (slot) slot.appendChild(document.getElementById("worlds-booth").content);
    })();
  </script>
  <script src="../../js/vendor/playcanvas.min.js"></script>
  <script src="worlds.js?v=20261118"></script>
</body>

</html>
