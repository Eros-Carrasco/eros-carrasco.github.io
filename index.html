<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Eros Carrasco — Creative Technologist, XR & AI</title>
  <meta name="description"
    content="Production-focused XR developer building interactive systems from concept to deployment. VR training simulations at Transfr, motion capture tooling, procedural worlds, and Unity multiplayer. NYU M.S." />
  <link rel="canonical" href="https://eros-carrasco.github.io/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Eros Carrasco" />
  <meta property="og:url" content="https://eros-carrasco.github.io/" />
  <meta property="og:title" content="Eros Carrasco — Creative Technologist, XR & AI" />

    content="Production-focused XR developer building interactive systems from concept to deployment. VR training, motion capture tooling, procedural worlds, Unity multiplayer." />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/images/favicon_0.png" />
</head>

<body>

  <main class="homepage-grid">

    <!-- ABOUT CARD (left column) -->
    <a class="card card-about" href="about/" data-project="about">
      <div class="card-media">
        <img src="assets/images/card_about.jpg" alt="Portrait of Eros Carrasco" width="1200" height="1355" />
      </div>

      <div class="card-about-caption">
        <h3 class="card-about-name">Eros Carrasco</h3>
        <div class="tags">
          <span>Creative Technologist</span>
          <span>XR</span>
          <span>NYU M.S.</span>
        </div>
      </div>

      <div class="card-overlay-icon" aria-hidden="true">↗</div>
    </a>

    <!-- PROJECT CARDS (right column, 2x2) -->
    <div class="projects-grid">

      <!-- TRANSFR CARD -->
      <a class="card" href="projects/transfr/" data-project="transfr">
        <div class="card-media">
          <video src="assets/videos/transfr_hero.mp4" poster="assets/images/poster_transfr.jpg" muted loop playsinline
            preload="none" tabindex="-1" aria-hidden="true"></video>
        </div>

        <div class="card-info">
          <h3>Transfr</h3>
          <div class="tags">
            <span>VR Training</span>
            <span>Industry Production</span>
          </div>
        </div>

        <div class="card-overlay-icon" aria-hidden="true">↗</div>
      </a>

      <!-- MOTION CAPTURE CARD -->
      <a class="card" href="projects/salsa-ai/" data-project="mocap">
        <div class="card-media">
          <video src="assets/videos/card_motionCapture.mp4" poster="assets/images/poster_mocap.jpg" muted loop
            playsinline preload="none" tabindex="-1" aria-hidden="true"></video>
        </div>

        <div class="card-info">
          <h3>Salsa AI</h3>
          <div class="tags">
            <span>Motion Capture</span>
            <span>Unity Tooling</span>
          </div>
        </div>

        <div class="card-overlay-icon" aria-hidden="true">↗</div>
      </a>

      <!-- PROCEDURAL WORLD GENERATION CARD -->
      <a class="card" href="projects/idm-biome/" data-project="procedural">
        <div class="card-media">
          <video src="assets/videos/procedural_hero_slow.mp4" poster="assets/images/poster_procedural.jpg" muted loop
            playsinline preload="none" tabindex="-1" aria-hidden="true"></video>
        </div>

        <div class="card-info">
          <h3>IDM Biome</h3>
          <div class="tags">
            <span>Arduino</span>
            <span>Procedural World Generation</span>
          </div>
        </div>

        <div class="card-overlay-icon" aria-hidden="true">↗</div>
      </a>

      <!-- MULTIPLAYER CARD -->
      <a class="card" href="projects/member-bot/" data-project="multiplayer">
        <div class="card-media">
          <video src="assets/videos/memberbot_hero.mp4" poster="assets/images/poster_multiplayer.jpg" muted loop
            playsinline preload="none" tabindex="-1" aria-hidden="true"></video>
        </div>

        <div class="card-info">
          <h3>Member Bot</h3>
          <div class="tags">
            <span>Unity Netcode</span>
          </div>
        </div>

        <div class="card-overlay-icon" aria-hidden="true">↗</div>
      </a>

    </div><!-- /projects-grid -->

  </main>

  <script src="js/main.js"></script>
