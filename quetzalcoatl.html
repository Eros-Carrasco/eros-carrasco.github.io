<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quetzalcoatl</title>
  <meta name="description" content="A gaussian splat capture, steam, a violet night and a feathered serpent that climbs and rests on his shoulder." />
  <!-- Reached by link only. Not part of the portfolio and not for search engines. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f0e18" />
  <link rel="icon" href="favicon.ico" />
  <style>
    html, body { margin: 0; height: 100%; background: #0f0e18; overflow: hidden; }
    /* The whole viewport is the stage. The same three canvases the portfolio's
       card holds, with the same ids, so the same scripts drive them. */
    .splat-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0f0e18;
      opacity: 0.35;
      transition: opacity 0.6s ease;
    }
    .splat-stage.is-ready { opacity: 1; }
    .splat-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    .splat-stage canvas:active { cursor: grabbing; }
    .splat-stage #backdrop-canvas,
    .splat-stage #splat-canvas { position: absolute; inset: 0; }
    .splat-stage #backdrop-canvas { z-index: 0; pointer-events: none; }
    .splat-stage #splat-canvas { z-index: 1; }
  </style>
</head>

<body>
  <div class="splat-stage" id="splat-stage">
    <canvas id="backdrop-canvas"></canvas>
    <canvas id="splat-canvas"></canvas>
  </div>

  <script src="js/vendor/playcanvas.min.js"></script>
  <script src="js/backdrop.js"></script>
  <!-- aura.js listens for the scene, so it loads before the stage hands it over -->
  <script src="js/serpent.js"></script>
  <script src="js/aura.js"></script>
  <script src="js/splat-stage.js"></script>
  <script>
    // Once the serpent has come to rest, a tap or a click plays it again. A
    // drag is still a drag: only a short press with no movement counts.
    (() => {
      const stage = document.getElementById("splat-stage");
      let downAt = 0, downX = 0, downY = 0;
      stage.addEventListener("pointerdown", (e) => { downAt = performance.now(); downX = e.clientX; downY = e.clientY; });
      stage.addEventListener("pointerup", (e) => {
        const still = Math.hypot(e.clientX - downX, e.clientY - downY) < 8 && performance.now() - downAt < 400;
        if (still && (window.__auraClock || 0) >= 9.7) location.reload();
      });
    })();
  </script>
</body>

</html>
